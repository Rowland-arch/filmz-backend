services:
  - type: web
    name: great-hd
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: rolandmugagga@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
